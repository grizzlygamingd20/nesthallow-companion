name: Build signed APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keeper.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/keeper.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/nesthallow-0.1.${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: nesthallow-apk
          path: dist/*.apk

      - name: Publish as a release (private repo, Keeper only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.1.${GITHUB_RUN_NUMBER}" dist/*.apk \
            --title "Nesthallow 0.1.${GITHUB_RUN_NUMBER}" \
            --notes "Signed APK built from ${GITHUB_SHA::7}. Download on your phone and tap to install over the previous version."
