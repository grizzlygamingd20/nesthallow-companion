name: Build signed APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Signing key comes from two Actions secrets: KEYSTORE_B64 and KEYSTORE_PASSWORD.
      # Without them the app is still compiled (so errors show up) but no installable APK is published.
      - name: Restore signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/keeper.jks"
            {
              echo "KEYSTORE_PATH=$RUNNER_TEMP/keeper.jks"
              echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KEY_ALIAS=nesthallow"
              echo "KEY_PASSWORD=$KEYSTORE_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Signing secrets not set yet. Building unsigned to check the code; no APK will be published."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        if: steps.key.outputs.signed == 'true'
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/nesthallow-0.1.${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.signed == 'true'
        with:
          name: nesthallow-apk
          path: dist/*.apk

      - name: Publish as a release (private repo, Keeper only)
        if: steps.key.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.1.${GITHUB_RUN_NUMBER}" dist/*.apk \
            --title "Nesthallow 0.1.${GITHUB_RUN_NUMBER}" \
            --notes "Signed APK built from ${GITHUB_SHA::7}. Download on your phone and tap to install over the previous version."
